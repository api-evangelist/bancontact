      - name: Bancontact Pro Merchant Reconciliation API
      - name: Bancontact Pro portal
      - name: PREPROD environment (on request via devsupport@bancontact.com)
      - name: Local support (+32 2 793 01 43)
scheme_fees:
  note: >-
    Separate from the Bancontact Pro tariff, the card scheme publishes fallback interchange and
    service fees for Bancontact card acceptance through acquirers at
    https://www.bancontact.com/en/professional/legal-and-administrative-specifications; those apply
    to terminal/acquirer channels, not to this API.
