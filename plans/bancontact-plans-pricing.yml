tags: [Banking, Belgium, Payments, Pricing]
description: >-
  Bancontact Pro publishes one transparent price for every solution, including the API-driven
  "integrated solution": €0.06 per transaction plus an €18 annual fee per account regardless of
  how many solutions are used, with no activation fee (prices exclude VAT). There is no per-call
  API pricing, no free tier and no self-service sign-up — access follows a merchant contract.
  Replaces the 2026-05-04 scaffold whose Free/Professional/Enterprise tiers were never published
  by the provider.
plan_count: 1
currency: EUR
plans:
  - id: bancontact-pro
    name: Bancontact Pro
    type: paid
    description: >-
      Single published tariff covering the Bancontact Pro app, sticker (static QR), integrated
      (API) and top-up solutions; the merchant portal, refunds, bulk IDs and Wero acceptance are
      included.
