versioning:
  scheme: URL path major version (/v3) + semver in info.version per contract
  current:
    payment-v3-api: 3.6.5 (2025-08-29)
    payment-refund-service-api: 3.0.3 (2025-10-01)
    merchant-reconciliation-api: 3.0.1
  header: none — no version header; a new major would be a new path prefix
  history: changelog/bancontact-changelog.yml
deprecation_policy:
  published: true
  docs: https://docs.bancontactpro.com/guides/general/payloadurlupdate
  headers: none — Deprecation / Sunset (RFC 8594/9745) headers are not documented
  mechanism: >-
    Dated migration notices on the developer portal with a PREPROD-first rollout: changes ship to
    merchant.api.preprod.bancontact.net for validation before a stated production date.
  active_deprecations:
    - id: payconiq-brand-urls
      title: payconiq.com payment URLs replaced by pay.bancontact.net
      announced_on_docs: true
      production_from: '2026-05-11'
      status: rolling out
      detail: >-
        Following the decommissioning of the Payconiq brand in Belgium, _links.deeplink.href moves
        from https://payconiq.com/pay/2/{txn} to https://pay.bancontact.net/pay/2/{txn}; the QR
        generator parameter c= follows; static QR / invoice / receipt templates move from
        https://payconiq.com/t/1/{PPID}?D=&A=&R= to https://pay.bancontact.net/t/1/{PPID}...; the
        checkout page moves from https://checkout.bancontact.net/ to https://pay.bancontact.net/.
        Endpoints and API version are unchanged; merchants printing fixed QR codes must re-issue
        them. PREPROD currently emits pay.acc.bancontact.net URLs.
    - id: payconiq-docs-host
      title: docs.payconiq.be retired
      status: completed
      detail: https://docs.payconiq.be/ answers 301 to https://docs.bancontactpro.com/ for every path.
  removed_recently:
