deprecated_operations: []   # no operation in any bundle carries deprecated: true
key_rotation:
  docs: https://docs.bancontactpro.com/guides/general/callback052025
  policy: >-
    Bancontact may rotate its signing certificate without prior notice; a new JWK is published
    24 hours before the old one is removed. Merchants must pin only the certificate CN, cache
    JWKS for at most 12 hours and re-fetch on verification failure.
