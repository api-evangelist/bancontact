identifiers:
  paymentId: 24 characters, also the remittance Payment ID on individual payouts
  bulkPayoutId: '24 hex chars, embedded in bulked-payout remittance YYYYMMDD-{bulkPayoutId}-{bulkId|NONE}-PQ-BulkRecon-{merchantId}'
  endToEndId: on successful payments; matches the End-to-end reference on the merchant's CAMT bank statement
