enums:
  PaymentStatus: [PENDING, IDENTIFIED, AUTHORIZED, AUTHORIZATION_FAILED, FAILED, SUCCEEDED, CANCELLED, EXPIRED, PENDING_MERCHANT_ACKNOWLEDGEMENT, VOIDED]
  PaymentType: [P2P, DIRECT_PAY, DYNAMIC, STATIC, TEMPLATE, UNKNOWN, SCAN_PAY, PAYMENT_REQUEST]
  PaymentStage: [AUTHORIZE, CAPTURE, COMPLETED, IDENTIFY, ACCEPT, NOTIFY, INITIALIZED, SOLVENCY, CANCEL, CREATE, CONFIRM, RISK_ACTIONS]
  Currency: [EUR]
  RefundStatus: [PENDING, REFUNDED, FAILED]
