apis:
- aid: bancontact:payconiq-acceptance-api
  name: Bancontact Pro Payment V3 API
  description: First-party OpenAPI 3.1 contract (v3.6.5) for the Bancontact Pro merchant acceptance service, formerly
    the Payconiq merchant API. Merchants create dynamic QR / deeplink / checkout payments, static-QR POS payments,
    search and cancel payments, acknowledge JWS-signed status callbacks, and look up a debtor's refund IBAN. Authenticated
    with a per-product API key in the Authorization header plus an ES256 detached JWS request signature; served
    on merchant.api.bancontact.net with a PREPROD twin.
  humanURL: https://docs.bancontactpro.com/apis/merchant-payment.openapi
