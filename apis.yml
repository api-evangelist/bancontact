- aid: bancontact:merchant-reconciliation-api
  name: Bancontact Pro Merchant Reconciliation API
  description: 'First-party OpenAPI 3.1 contract (v3.0.1) for reconciling Bancontact Pro payouts with the payments
    and refunds they settle: list payouts by date, list SUCCEEDED payments and refunds by payout id or 30-day date
    range, paged with page/size. Reconciliation data is published D+1 from 09:00 CET in both PREPROD and PROD; requests
    carry an ES256 detached JWS signature.'
  humanURL: https://docs.bancontactpro.com/apis/merchant-reconciliation.openapi
