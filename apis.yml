aid: bancontact
name: Bancontact
description: 'Bancontact Company nv/sa (formerly Bancontact Payconiq Company) operates Belgium''s national debit
  card scheme and the Bancontact Pro merchant acceptance service (the rebranded Payconiq merchant platform). The
  Bancontact Pro developer portal publishes three OpenAPI 3.1 contracts on merchant.api.bancontact.net: the Payment
  V3 API (create, search, cancel and acknowledge QR/deeplink/checkout payments, with JWS-signed status callbacks),
  the Payment Refund Service API (idempotent refunds against SUCCEEDED payments) and the Merchant Reconciliation
  API (D+1 payouts, payments and refunds). Merchants authenticate with per-product API keys and ES256 detached JWS
  signatures verified against public JWKS endpoints, test end-to-end in a PREPROD environment with published test
  cards, and pay €0.06 per transaction plus €18 per year.'
