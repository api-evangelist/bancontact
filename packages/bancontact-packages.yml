source: >-
  Searched npm, PyPI, Packagist, NuGet, Maven Central and GitHub (orgs bancontact,
  bancontactpro, payconiq, bancontact-payconiq) on 2026-09-17, plus every page of
  docs.bancontactpro.com. Bancontact Company publishes NO first-party client library
  for the Bancontact Pro API: the developer portal links only the three OpenAPI
  bundles and devsupport@bancontact.com. What exists is community-authored, and the
  legacy github.com/payconiq org (Payconiq International, now part of EPI/Wero — a
  different company from Bancontact Company nv/sa) still hosts JWS signing utilities
  for the predecessor Payconiq V2/V3 merchant API. None of these is marked official.
